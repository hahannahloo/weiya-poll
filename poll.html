<title>尾牙即時投票</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: a lacquer-red stage. Big screen = question + gold bars on the left, QR rail on the right.
   Phone = one column of tall choices. Deliberately single dark theme, like a banquet hall. */
:root{
  --ink:#160809;
  --lacquer:#3d0d10;
  --red:#c22b2f;
  --gold:#e6bd6a;
  --gold-hi:#fbe3a4;
  --gold-lo:#8d5a22;
  --paper:#f6eadb;
  --muted:#c9ab9a;
  --line:rgba(230,189,106,.24);
  --glass:rgba(246,234,219,.05);
  --seal-ink:#fff4e0;
  --qr-bg:#fbf3e6;
  --err:#ffb0a5;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--ink);
  background-image:radial-gradient(120% 80% at 50% -10%,#6a161b 0%,rgba(61,13,16,.92) 38%,rgba(22,8,9,0) 76%);
  background-attachment:fixed;
  color:var(--paper);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(230,189,106,.11) 1px,transparent 1.6px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%);
  mask-image:linear-gradient(to bottom,#000,transparent 70%);
}
#app{position:relative;z-index:1;min-height:100%}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* shared */
.seal{
  display:inline-grid;place-items:center;flex:none;
  width:52px;height:52px;border-radius:6px;
  background:var(--red);color:var(--seal-ink);
  font-family:var(--f-display);font-weight:900;font-size:17px;line-height:1.05;letter-spacing:.08em;
  writing-mode:vertical-rl;
  box-shadow:inset 0 0 0 2px rgba(255,235,200,.35),0 6px 18px rgba(0,0,0,.35);
  transform:rotate(-4deg);
}
.seal.sm{width:40px;height:40px;font-size:13px}
.seal.lg{width:76px;height:76px;font-size:24px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.ev{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,1.6vw,28px);color:var(--gold-hi);letter-spacing:.06em;line-height:1.3}
.sub{color:var(--muted);font-size:clamp(12px,1vw,17px);letter-spacing:.2em}
.qno{color:var(--gold);letter-spacing:.18em;font-size:clamp(13px,1.2vw,22px);font-variant-numeric:tabular-nums}
.qno b{font-family:var(--f-display);font-size:1.5em;color:var(--gold-hi);font-weight:900}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.15;transform:translateY(14px)}to{opacity:1;transform:none}}

/* bars */
.bars{display:flex;flex-direction:column;gap:clamp(14px,2.6vh,30px)}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:8px}
.opt{font-size:clamp(17px,1.9vw,36px);font-weight:500;min-width:0;line-height:1.35;transition:color .4s}
.val{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:none;font-size:clamp(11px,.85vw,15px);letter-spacing:.15em;color:var(--ink);background:var(--gold-hi);padding:2px 10px;border-radius:999px;align-self:center}
.pct{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.4vw,46px);color:var(--gold-hi);min-width:2.6em;text-align:right}
.cnt{color:var(--muted);font-size:clamp(13px,1.1vw,20px);min-width:3.2em;text-align:right}
.track{height:clamp(14px,2.2vh,28px);border-radius:999px;background:rgba(246,234,219,.06);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.fill{position:relative;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-lo),var(--gold) 60%,var(--gold-hi));transition:width 1s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.row.lead .opt{color:var(--gold-hi)}
.row.lead .chip{display:inline-block}
.row.lead .fill{box-shadow:0 0 26px rgba(251,227,164,.5)}
.row.lead .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.bars.concealed .pct{color:var(--muted)}
.bars.compact{gap:14px}
.bars.compact .opt{font-size:16px}
.bars.compact .pct{font-size:20px}
.bars.compact .cnt{font-size:13px}
.bars.compact .chip{font-size:11px}
.bars.compact .track{height:12px}

/* big screen */
.screen{min-height:100%;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(16px,3vh,40px);padding-block:clamp(16px,3.5vh,48px)}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.s-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,22vw,360px);gap:clamp(24px,4vw,72px);align-items:center}
.s-q{min-width:0}
.s-q h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4.4vw,84px);line-height:1.2;margin:0 0 clamp(20px,4.5vh,56px);text-wrap:balance}
.s-side{display:flex;flex-direction:column;gap:20px}
.qr-card{background:var(--qr-bg);color:var(--ink);border-radius:18px;padding:16px 16px 12px;text-align:center;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5)}
.qr-card #qr svg{display:block;width:100%;height:auto}
.qr-card #qr{line-height:1.3;overflow-wrap:anywhere}
.qr-card p{margin:10px 0 0;font-weight:700;font-size:clamp(14px,1.15vw,20px);letter-spacing:.08em}
.total{display:flex;align-items:baseline;justify-content:center;gap:10px;border-block:1px solid var(--line);padding-block:14px}
.total .lbl,.total .unit{color:var(--muted);letter-spacing:.15em;font-size:clamp(13px,1vw,18px)}
.total .num{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,4.6vw,88px);color:var(--gold-hi);font-variant-numeric:tabular-nums;line-height:1}
.status{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);letter-spacing:.2em;font-size:clamp(13px,1vw,18px)}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(194,43,47,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(194,43,47,0)}100%{box-shadow:0 0 0 0 rgba(194,43,47,0)}}
@media (max-width:900px){
  .s-main{grid-template-columns:1fr;align-items:start}
  .s-side{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);align-items:center}
  .s-side .status{grid-column:1/-1}
}

/* phone */
.phone{max-width:520px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:24px}
.p-q h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,7vw,32px);line-height:1.3;margin:6px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt-btn{
  appearance:none;width:100%;text-align:left;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:64px;padding:14px 18px;border-radius:14px;
  border:1px solid var(--line);background:var(--glass);color:var(--paper);
  font:500 18px/1.4 var(--f-body);
  transition:transform .15s,background .25s,border-color .25s,box-shadow .25s;
}
.opt-btn:hover{border-color:var(--gold)}
.opt-btn:active{transform:scale(.98)}
.opt-btn .mark{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700}
.opt-btn.chosen{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:transparent;font-weight:700;box-shadow:0 10px 30px rgba(230,189,106,.25)}
.opt-btn.chosen .mark{background:var(--ink);border-color:var(--ink);color:var(--gold-hi)}
.hint{color:var(--muted);text-align:center;font-size:14px;margin:0}
.hint.ok{color:var(--gold-hi)}
.hint.err{color:var(--err)}

/* buttons, admin, landing */
.btn{appearance:none;cursor:pointer;min-height:52px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--paper);font:700 16px/1.2 var(--f-body);transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:transparent}
.btn.danger{color:var(--err);border-color:rgba(255,160,140,.35)}
.btn.armed{background:var(--red);color:var(--seal-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.admin{max-width:1100px;margin:0 auto;padding-block:24px 56px;display:flex;flex-direction:column;gap:24px}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.a-links{display:flex;gap:8px;flex-wrap:wrap}
.a-links a{color:var(--gold-hi);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.a-links a:hover{border-color:var(--gold)}
.a-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.a-grid{grid-template-columns:1fr}}
.panel{background:rgba(22,8,9,.55);border:1px solid var(--line);border-radius:18px;padding:22px}
.a-live h2{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,32px);margin:4px 0 20px;line-height:1.3;text-wrap:balance}
.a-total{margin-top:18px;color:var(--muted)}
.a-total b{font-family:var(--f-display);color:var(--gold-hi);font-size:22px;font-variant-numeric:tabular-nums}
.a-ctrl{display:flex;flex-direction:column;gap:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl-sm{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:14px 0 0}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.qlist button{width:100%;text-align:left;display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font:500 15px/1.4 var(--f-body);cursor:pointer}
.qlist button:hover{color:var(--paper)}
.qlist .n{font-family:var(--f-display);font-weight:700;color:var(--gold);min-width:1.4em;font-variant-numeric:tabular-nums}
.qlist button.on{border-color:var(--line);background:rgba(230,189,106,.08);color:var(--paper)}
.gate{max-width:360px;margin:0 auto;padding-block:15vh 40px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.gate h1{font-family:var(--f-display);font-weight:900;font-size:28px;margin:8px 0 0;color:var(--gold-hi)}
.gate form{display:flex;flex-direction:column;gap:12px;width:100%}
.gate input{width:100%;font:700 24px var(--f-body);text-align:center;letter-spacing:.5em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--paper)}
.landing{max-width:780px;margin:0 auto;padding-block:clamp(40px,10vh,100px) 56px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.landing h1{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,8vw,72px);margin:14px 0 0;line-height:1.1;color:var(--gold-hi);text-wrap:balance}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;margin-top:20px}
@media (max-width:640px){.doors{grid-template-columns:1fr}}
.doors a{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--paper);text-decoration:none;transition:border-color .2s,transform .2s}
.doors a:hover{border-color:var(--gold);transform:translateY(-2px)}
.doors b{font-family:var(--f-display);font-size:22px;color:var(--gold-hi)}
.doors span{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;max-width:62ch;margin:12px 0 0}
.demo-pill{position:fixed;z-index:5;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.12em;color:var(--ink);background:var(--gold);padding:5px 12px;border-radius:999px;opacity:.9;pointer-events:none}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);letter-spacing:.3em}
.fatal{max-width:560px;margin:0 auto;padding-block:15vh;color:var(--err)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="loading">載入中</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============================================================
   ✏️ 只需要改這一段
   ============================================================ */
const CONFIG = {
  eventTitle: "2026 年終尾牙",
  subtitle: "丙午年 · 同樂之夜",
  adminPin: "8888",            // 主持人控制台密碼

  // 填入 Firebase 設定後就會變成正式版；留空 = 示範模式（只在本機瀏覽器同步）
  firebase: {
    apiKey: "",
    authDomain: "",
    databaseURL: "",
    projectId: "",
    appId: ""
  },

  questions: [
    { q: "今晚你最期待的是？", options: ["🍖 吃好料", "🧧 抽大獎", "🍻 跟同事喝一杯", "🏠 準時回家"] },
    { q: "今年你最常說的一句話？", options: ["「收到」", "「我確認一下」", "「這個誰負責的？」", "「下班了嗎？」"] },
    { q: "今年的爆肝指數？", options: ["😌 1–3 分，輕鬆愉快", "🙂 4–6 分，還撐得住", "🥵 7–9 分，靠咖啡續命", "👻 10 分，已經成仙"] },
    { q: "🏆 年度最佳笑點擔當（請換成同事名字）", options: ["同事 A", "同事 B", "同事 C", "同事 D"] },
    { q: "明年尾牙想去哪？", options: ["🏨 飯店宴會廳", "🏝️ 員工旅遊順便辦", "🔥 露營烤肉", "🧧 不用辦，紅包包大包就好"] }
  ]
};
/* ============================================================ */

(function(){
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q = CONFIG.questions;
const app = $('#app');
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clampQ = n => Math.min(Math.max(0, n|0), Q.length - 1);
let api = null;

/* ---------- storage helpers ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let memId = null;
function deviceId(){
  let id = lsGet('weiya-device') || memId;
  if(!id){ id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); lsSet('weiya-device', id); }
  memId = id; return id;
}

/* ---------- backend: demo (same-browser tabs) ---------- */
function makeDemoBackend(){
  const KEY = 'weiya-demo-v1';
  let mem = { state:{ current:0, reveal:true }, votes:{} };
  const load = () => { const s = lsGet(KEY); if(s){ try{ mem = JSON.parse(s); }catch(e){} } };
  const stateSubs = new Set(), voteSubs = new Set();
  const emit = () => {
    stateSubs.forEach(cb => cb({ ...mem.state }));
    voteSubs.forEach(s => s.cb({ ...(mem.votes[s.q] || {}) }));
  };
  let bc = null;
  try{ bc = new BroadcastChannel('weiya-demo'); bc.onmessage = () => { load(); emit(); }; }catch(e){}
  window.addEventListener('storage', e => { if(e.key === KEY){ load(); emit(); } });
  const save = () => { lsSet(KEY, JSON.stringify(mem)); try{ bc && bc.postMessage(1); }catch(e){} emit(); };
  load();
  return {
    demo: true,
    onState(cb){ stateSubs.add(cb); setTimeout(() => cb({ ...mem.state })); return () => stateSubs.delete(cb); },
    onVotes(q, cb){ const s = { q, cb }; voteSubs.add(s); setTimeout(() => cb({ ...(mem.votes[q] || {}) })); return () => voteSubs.delete(s); },
    onMyVote(q, dev, cb){ return this.onVotes(q, v => cb(v[dev] ?? null)); },
    setState(p){ load(); Object.assign(mem.state, p); save(); return Promise.resolve(); },
    vote(q, dev, opt){ load(); (mem.votes[q] = mem.votes[q] || {})[dev] = opt; save(); return Promise.resolve(); },
    reset(q){ load(); delete mem.votes[q]; save(); return Promise.resolve(); },
    simulate(q, n){
      load();
      const v = mem.votes[q] = mem.votes[q] || {};
      const k = Q[q].options.length;
      const w = Q[q].options.map((_, i) => (k - i) * 0.6 + Math.random() * 3);
      const sum = w.reduce((a, b) => a + b, 0);
      for(let j = 0; j < n; j++){
        let r = Math.random() * sum, i = 0;
        while(r > w[i] && i < k - 1){ r -= w[i]; i++; }
        v['sim' + Math.random().toString(36).slice(2,10)] = i;
      }
      save();
    }
  };
}

/* ---------- backend: Firebase Realtime Database ---------- */
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function makeFirebaseBackend(cfg){
  const V = '10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  firebase.initializeApp(cfg);
  const db = firebase.database();
  const listen = (path, cb) => { const r = db.ref(path); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); };
  return {
    demo: false,
    onState(cb){ return listen('state', v => cb({ current:0, reveal:true, ...(v || {}) })); },
    onVotes(q, cb){ return listen('votes/' + q, v => cb(v || {})); },
    onMyVote(q, dev, cb){ return listen('votes/' + q + '/' + dev, v => cb(v ?? null)); },
    setState(p){ return db.ref('state').update(p); },
    vote(q, dev, opt){ return db.ref('votes/' + q + '/' + dev).set(opt); },
    reset(q){ return db.ref('votes/' + q).remove(); },
    simulate: null
  };
}

/* ---------- tally + bars ---------- */
function tally(q, votes){
  const counts = Q[q].options.map(() => 0);
  let total = 0;
  for(const k in votes){ const v = votes[k]; if(Number.isInteger(v) && v >= 0 && v < counts.length){ counts[v]++; total++; } }
  return { counts, total };
}
function tween(el, to, fmt){
  const from = +(el.dataset.v || 0);
  el.dataset.v = to;
  if(reduced || from === to){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 800;
  const step = t => {
    if(+el.dataset.v !== to) return;
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e));
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function buildBars(box, q){
  box.innerHTML = Q[q].options.map((o, i) => `
    <div class="row" data-i="${i}">
      <div class="row-top">
        <span class="opt">${esc(o)}</span>
        <span class="val"><span class="chip">領先</span><span class="pct" data-v="0">0%</span><span class="cnt">0 票</span></span>
      </div>
      <div class="track"><div class="fill"></div></div>
    </div>`).join('');
}
function updateBars(box, counts, total, reveal){
  box.classList.toggle('concealed', !reveal);
  const max = Math.max(0, ...counts);
  box.querySelectorAll('.row').forEach((row, i) => {
    const c = counts[i] || 0;
    const pct = total ? Math.round(c * 100 / total) : 0;
    row.querySelector('.fill').style.width = reveal ? pct + '%' : '0%';
    const pe = row.querySelector('.pct'), ce = row.querySelector('.cnt');
    if(reveal){ tween(pe, pct, v => v + '%'); ce.textContent = c + ' 票'; }
    else { pe.dataset.v = 0; pe.textContent = '？'; ce.textContent = ''; }
    row.classList.toggle('lead', reveal && c > 0 && c === max);
  });
}
function brandHTML(sealCls){
  return `<div class="brand"><span class="seal ${sealCls||''}">尾牙</span><div><div class="ev">${esc(CONFIG.eventTitle)}</div><div class="sub">${esc(CONFIG.subtitle)}</div></div></div>`;
}
function voteUrl(){ return location.href.split('#')[0] + '#vote'; }

/* ---------- view: big screen ---------- */
function viewScreen(){
  app.innerHTML = `
  <div class="screen">
    <header class="s-head">${brandHTML()}<div class="qno" id="sqno"></div></header>
    <main class="s-main">
      <section class="s-q" id="sqbox"><h1 id="sq"></h1><div class="bars" id="bars"></div></section>
      <aside class="s-side">
        <div class="qr-card"><div id="qr"></div><p>手機掃描 · 立即投票</p></div>
        <div class="total"><span class="lbl">已投票</span><span class="num" id="total" data-v="0">0</span><span class="unit">人</span></div>
        <div class="status" id="status"></div>
      </aside>
    </main>
  </div>`;
  try{
    const qr = qrcode(0, 'M'); qr.addData(voteUrl()); qr.make();
    const n = qr.getModuleCount(); let d = '';
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    $('#qr').innerHTML = `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" role="img" aria-label="投票頁 QR Code" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="var(--qr-bg)"/><path d="${d}" fill="var(--ink)"/></svg>`;
  }catch(e){ $('#qr').textContent = voteUrl(); }

  let cur = -1, state = { current:0, reveal:true }, votes = {}, unsubV = null;
  const paint = () => {
    if(cur < 0) return;
    const { counts, total } = tally(cur, votes);
    updateBars($('#bars'), counts, total, state.reveal);
    tween($('#total'), total, v => String(v));
    $('#status').innerHTML = state.reveal ? '<span class="dot"></span>即時統計中' : '<span class="dot"></span>投票中 · 結果稍後揭曉';
  };
  const unsubS = api.onState(s => {
    state = s;
    const q = clampQ(s.current);
    if(q !== cur){
      cur = q; votes = {};
      $('#sq').textContent = Q[q].q;
      $('#sqno').innerHTML = `第 <b>${q + 1}</b> / ${Q.length} 題`;
      buildBars($('#bars'), q);
      $('#total').dataset.v = 0;
      const box = $('#sqbox'); box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
      unsubV && unsubV();
      unsubV = api.onVotes(q, v => { votes = v; paint(); });
    }
    paint();
  });
  return () => { unsubS(); unsubV && unsubV(); };
}

/* ---------- view: phone voting ---------- */
function viewVote(){
  app.innerHTML = `
  <div class="phone">
    <header>${brandHTML('sm')}</header>
    <section class="p-q" id="pqbox"><div class="qno" id="pqno"></div><h1 id="pq"></h1></section>
    <div class="opts" id="opts"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>`;
  const dev = deviceId();
  let cur = -1, mine = null, unsubM = null, err = '';
  const draw = () => {
    if(cur < 0) return;
    $('#opts').querySelectorAll('.opt-btn').forEach((b, i) => {
      const on = mine === i;
      b.classList.toggle('chosen', on);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.mark').textContent = on ? '✓' : '';
    });
    const h = $('#hint');
    if(err){ h.className = 'hint err'; h.textContent = err; }
    else if(mine !== null){ h.className = 'hint ok'; h.textContent = '已送出！想改的話直接點別的選項。結果請看大螢幕 👀'; }
    else { h.className = 'hint'; h.textContent = '點一個答案就完成投票'; }
  };
  $('#opts').addEventListener('click', e => {
    const b = e.target.closest('.opt-btn'); if(!b || cur < 0) return;
    const i = +b.dataset.i, q = cur, prev = mine;
    mine = i; err = ''; draw();
    if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
    api.vote(q, dev, i).catch(() => { if(cur === q){ mine = prev; err = '沒有送出，請檢查網路後再點一次'; draw(); } });
  });
  const unsubS = api.onState(s => {
    const q = clampQ(s.current);
    if(q === cur) return;
    cur = q; mine = null; err = '';
    $('#pqno').innerHTML = `第 <b>${q + 1}</b> 題 / 共 ${Q.length} 題`;
    $('#pq').textContent = Q[q].q;
    $('#opts').innerHTML = Q[q].options.map((o, i) =>
      `<button type="button" class="opt-btn" id="opt-${i}" data-i="${i}" aria-pressed="false"><span>${esc(o)}</span><span class="mark" aria-hidden="true"></span></button>`).join('');
    const box = $('#pqbox'); box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
    unsubM && unsubM();
    unsubM = api.onMyVote(q, dev, v => { if(cur === q){ mine = Number.isInteger(v) ? v : null; draw(); } });
    draw();
  });
  return () => { unsubS(); unsubM && unsubM(); };
}

/* ---------- view: host console ---------- */
function viewAdmin(){
  let ok = false;
  try{ ok = sessionStorage.getItem('weiya-admin') === '1'; }catch(e){}
  if(!ok){
    app.innerHTML = `
    <div class="gate">
      <span class="seal lg">尾牙</span>
      <h1>主持人控制台</h1>
      <form id="gate">
        <label class="lbl-sm" for="pin">請輸入密碼</label>
        <input id="pin" inputmode="numeric" autocomplete="off" maxlength="12" autofocus>
        <button class="btn primary" type="submit">進入</button>
        <p class="hint" id="gerr"></p>
      </form>
      ${api.demo ? `<p class="hint">示範密碼：${esc(CONFIG.adminPin)}</p>` : ''}
    </div>`;
    $('#gate').addEventListener('submit', e => {
      e.preventDefault();
      if($('#pin').value.trim() === String(CONFIG.adminPin)){
        try{ sessionStorage.setItem('weiya-admin', '1'); }catch(_){}
        route(true);
      } else { $('#gerr').className = 'hint err'; $('#gerr').textContent = '密碼不對，再試一次'; }
    });
    return null;
  }

  app.innerHTML = `
  <div class="admin">
    <header class="a-head">${brandHTML('sm')}<nav class="a-links"><a href="#screen">開大螢幕</a><a href="#vote">看手機畫面</a></nav></header>
    <div class="a-grid">
      <section class="panel a-live">
        <div class="qno" id="aqno"></div>
        <h2 id="aq"></h2>
        <div class="bars compact" id="abars"></div>
        <div class="a-total">共 <b id="atotal">0</b> 人投票（主持人永遠看得到結果）</div>
      </section>
      <section class="a-ctrl">
        <div class="btnrow"><button class="btn" id="prev" type="button">← 上一題</button><button class="btn primary" id="next" type="button">下一題 →</button></div>
        <button class="btn" id="reveal" type="button"></button>
        ${api.simulate ? '<button class="btn" id="sim" type="button">＋ 模擬 10 位來賓投票</button>' : ''}
        <button class="btn danger" id="reset" type="button">清除本題票數</button>
        <p class="lbl-sm">跳到指定題目</p>
        <ol class="qlist" id="qlist">${Q.map((x, i) => `<li><button type="button" id="jump-${i}" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(x.q)}</span></button></li>`).join('')}</ol>
      </section>
    </div>
  </div>`;

  let cur = -1, state = { current:0, reveal:true }, votes = {}, unsubV = null, armTimer = null;
  const paint = () => {
    if(cur < 0) return;
    const { counts, total } = tally(cur, votes);
    updateBars($('#abars'), counts, total, true);
    $('#atotal').textContent = total;
    $('#reveal').textContent = state.reveal ? '🙈 大螢幕顯示結果中 · 點此隱藏' : '🎉 揭曉結果！';
    $('#reveal').className = state.reveal ? 'btn' : 'btn primary';
    $('#prev').disabled = cur === 0;
    $('#next').disabled = cur === Q.length - 1;
    $('#qlist').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === cur));
  };
  const go = q => api.setState({ current: clampQ(q) });
  $('#prev').onclick = () => go(cur - 1);
  $('#next').onclick = () => go(cur + 1);
  $('#qlist').onclick = e => { const b = e.target.closest('button'); if(b) go(+b.dataset.i); };
  $('#reveal').onclick = () => api.setState({ reveal: !state.reveal });
  if($('#sim')) $('#sim').onclick = () => api.simulate(cur, 10);
  const disarm = () => { clearTimeout(armTimer); armTimer = null; const r = $('#reset'); if(r){ r.classList.remove('armed'); r.textContent = '清除本題票數'; } };
  $('#reset').onclick = () => {
    const r = $('#reset');
    if(!armTimer){ r.classList.add('armed'); r.textContent = '確定要清除？再按一次'; armTimer = setTimeout(disarm, 3500); return; }
    disarm(); api.reset(cur);
  };
  const unsubS = api.onState(s => {
    state = s;
    const q = clampQ(s.current);
    if(q !== cur){
      cur = q; votes = {}; disarm();
      $('#aqno').innerHTML = `第 <b>${q + 1}</b> / ${Q.length} 題 · 大螢幕目前顯示`;
      $('#aq').textContent = Q[q].q;
      buildBars($('#abars'), q);
      unsubV && unsubV();
      unsubV = api.onVotes(q, v => { votes = v; paint(); });
    }
    paint();
  });
  return () => { unsubS(); unsubV && unsubV(); clearTimeout(armTimer); };
}

function viewLanding(){
  app.innerHTML = `
  <div class="landing">
    <span class="seal lg">尾牙</span>
    <h1>${esc(CONFIG.eventTitle)}<br>即時投票</h1>
    <p class="sub">${esc(CONFIG.subtitle)}</p>
    <nav class="doors">
      <a href="#screen"><b>大螢幕</b><span>投影在會場，顯示 QR Code 和即時長條圖</span></a>
      <a href="#vote"><b>手機投票</b><span>來賓掃碼後看到的畫面</span></a>
      <a href="#admin"><b>主持人控制台</b><span>切換題目、隱藏或揭曉結果</span></a>
    </nav>
    ${api.demo
      ? `<p class="note">現在是示範模式：資料只存在這台電腦的瀏覽器裡。在同一個瀏覽器開兩個分頁，一個開「大螢幕」、一個開「主持人控制台」，按「模擬 10 位來賓投票」就能看到長條圖即時長出來。正式使用前，照說明填好 Firebase 設定即可讓所有人的手機連線。</p>`
      : `<p class="note">已連線，所有裝置會即時同步。</p>`}
  </div>`;

}

/* ---------- router ---------- */
let cleanup = null;
function route(){
  if(cleanup){ try{ cleanup(); }catch(e){} }
  const h = location.hash.slice(1);
  document.body.dataset.view = h || 'home';
  const v = { screen: viewScreen, vote: viewVote, admin: viewAdmin }[h] || viewLanding;
  cleanup = v() || null;
  window.scrollTo(0, 0);
}

(async function init(){
  try{
    api = CONFIG.firebase && CONFIG.firebase.apiKey ? await makeFirebaseBackend(CONFIG.firebase) : makeDemoBackend();
  }catch(e){
    app.innerHTML = `<div class="fatal"><h2>連不上 Firebase</h2><p>請檢查 CONFIG.firebase 的設定是否正確、網路是否正常，然後重新整理。</p></div>`;
    return;
  }
  if(api.demo){ const p = document.createElement('div'); p.className = 'demo-pill'; p.textContent = '示範模式'; document.body.appendChild(p); }
  window.addEventListener('hashchange', route);
  route();
})();
})();
</script>
